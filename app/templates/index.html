<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PaperLens</title>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar"><div class="topbar-inner">
    <div class="brand"><span class="logo">PL</span>
      <div><div class="brand-name">Pikanalizer</div><div class="brand-sub">Research paper insights</div></div></div>
    <nav class="nav">
      <button class="nav-link active" data-view="process">Process paper</button>
      <button class="nav-link" data-view="history">History</button>
      <button class="nav-link" data-view="settings">Settings</button>
    </nav>
  </div></header>

  <div class="tabbar"><div class="container tabbar-inner">
    <div class="tabs" id="tabs"></div>
    <button class="tab-add" id="newTabBtn">+ New paper</button>
  </div></div>

  <main class="container">
    <!-- PROCESS VIEW -->
    <section class="view" id="view-process">
      <h2 class="page-title">NLP</h2>
      <p class="subtitle">Summaries, keywords and key insights and some more.</p>

      <div class="panel">
        <div class="upload-row">
          <div class="dropzone" id="dropzone" tabindex="0">
            <div class="dz-title">Drag and drop a PDF here</div>
            <div class="dz-or">or click to browse</div>
            <div class="dz-note" id="fileName">Text-based PDF files only</div>
            <input type="file" id="fileInput" accept=".pdf" hidden>
          </div>
          <div class="upload-buttons">
            <button class="btn btn-solid" id="uploadBtn">Upload</button>
            <button class="btn btn-outline" id="clearBtn">Clear</button>
          </div>
        </div>
        <div class="fetch-row">
          <input type="text" id="arxivInput" placeholder="Or paste an arXiv ID or link, e.g. 1706.03762">
        </div>
      </div>

      <div class="panel controls">
        <div>
          <div class="label">Mode</div>
          <label class="option"><input type="radio" name="mode" value="fast"><span><b>Fast</b><small>TF-IDF scoring only</small></span></label>
          <label class="option"><input type="radio" name="mode" value="accurate" checked><span><b>Accurate</b><small>TextRank (graph based)</small></span></label>
          <label class="option"><input type="radio" name="mode" value="compare"><span><b>Compare</b><small>Both methods plus lead baseline</small></span></label>
        </div>
        <div>
          <div class="label">Summary length</div>
          <div class="segmented">
            <label><input type="radio" name="length" value="short"><span>Short</span></label>
            <label><input type="radio" name="length" value="medium" checked><span>Medium</span></label>
            <label><input type="radio" name="length" value="long"><span>Long</span></label>
          </div>
          <details class="advanced"><summary>Advanced options</summary>
            <label class="field">Word normalization
              <select id="normSelect"><option value="lemma">Lemmatization</option><option value="stem">Stemming</option></select></label>
            <label class="field">Keyword n-gram range
              <select id="ngramSelect"><option value="1-2">1 to 2 words</option><option value="1-3">1 to 3 words</option></select></label>
          </details>
        </div>
      </div>

      <button class="btn btn-solid process-btn" id="processBtn">Process paper</button>
      <div class="progress hidden" id="progress"><div id="progressBar"></div></div>
      <div class="status" id="status" role="status"></div>

      <!-- RESULTS -->
      <section class="results hidden" id="results">
        <div class="rtabs" id="rtabs"></div>
        <div class="panel" id="rbody"></div>
      </section>
    </section>

    <!-- HISTORY VIEW -->
    <section class="view hidden" id="view-history">
      <h1 class="page-title">History</h1>
      <p class="subtitle">An audit log of everything done in this app.</p>
      <div class="panel" id="historyBody"></div>
    </section>

    <!-- SETTINGS VIEW -->
    <section class="view hidden" id="view-settings">
      <h1 class="page-title">Settings</h1>
      <p class="subtitle">Saved in this browser.</p>
      <div class="panel settings">
        <label class="field">Default mode
          <select id="setMode"><option value="fast">Fast</option><option value="accurate">Accurate</option><option value="compare">Compare</option></select></label>
        <label class="field">Default length
          <select id="setLength"><option value="short">Short</option><option value="medium">Medium</option><option value="long">Long</option></select></label>
        <label class="field">Theme
          <select id="setTheme"><option value="light">Light</option><option value="dark">Dark</option></select></label>
        <button class="btn btn-outline" id="clearHistoryBtn">Clear history</button>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
